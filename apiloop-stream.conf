# 过渡配置：8765 端口上 https 和 http 同时能用（2026-10-14，升级到 2.4.0 期间用）。
#
# 为什么要它：2.4.0 起云端是 https://leonaz.top:8765，可是旧客户端（2.3.0 及以前）
# 里写死的是 http://leonaz.top:8765。8765 只接 https 时，旧客户端连不上云端，
# 看不到新版本、一键更新也用不了。这份配置在 8765 上先看一眼连接：
#   - 是 TLS（https）→ 转给 apiloop.conf 那个 https 站点（过渡期它改听 127.0.0.1:8766）
#   - 是普通 http    → 直接转给 docker（127.0.0.1:18765）
# 旧客户端就能照旧连上，一键更新到 2.4.0；新版本里的地址是 https、端口不变，本机数据照常用。
#
# 要求 nginx 有 stream 模块和 ssl_preread（`nginx -V 2>&1 | grep -o ssl_preread` 有输出才行；
# Debian / Ubuntu 没有就 `apt install libnginx-mod-stream`）。
#
# ---------------------------------------------------------------- 开启过渡
#   1. cp apiloop-stream.conf /etc/nginx/apiloop-stream.conf
#   2. /etc/nginx/nginx.conf 里，**在 http { … } 外面**（文件最后一行就行）加：
#          include /etc/nginx/apiloop-stream.conf;
#      stream 块不能放进 conf.d/（conf.d 是在 http { } 里面被引入的，放那儿会报错）。
#      如果 nginx -t 报 unknown directive "stream"，说明模块是动态加载的，在 nginx.conf
#      最上面加 load_module modules/ngx_stream_module.so;（Debian 装了 libnginx-mod-stream
#      一般会自动放进 modules-enabled，不用手加）。
#   3. /etc/nginx/conf.d/apiloop.conf 里把
#          listen 8765 ssl;
#      改成
#          listen 127.0.0.1:8766 ssl;
#      （8765 让给下面的 stream，https 站点退到本机 8766）
#   4. nginx -t && nginx -s reload
#   5. 验证：
#          curl -s http://leonaz.top:8765/__admin/api/downloads    （旧客户端走的路，要有 JSON）
#          curl -s https://leonaz.top:8765/__admin/api/downloads   （新客户端、浏览器走的路）
#
# ---------------------------------------------------------------- 关掉过渡（大家都升级完以后）
# 过渡期间 http 开着，旧客户端的登录密码是明文传的，升级完就关，别一直留着：
#   1. nginx.conf 里删掉 include /etc/nginx/apiloop-stream.conf; 那一行
#   2. apiloop.conf 里 listen 改回 listen 8765 ssl;
#   3. nginx -t && nginx -s reload

stream {
    # $ssl_preread_protocol：TLS 握手里的协议版本；不是 TLS（普通 http）时为空
    map $ssl_preread_protocol $apiloop_backend {
        ""      127.0.0.1:18765;
        default 127.0.0.1:8766;
    }

    server {
        listen 8765;
        ssl_preread on;
        proxy_pass $apiloop_backend;
        proxy_connect_timeout 10s;
        # 同步、下载安装包、WebSocket 可能挂很久
        proxy_timeout 600s;
    }
}
