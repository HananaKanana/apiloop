# apiloop 的 nginx 配置：对外 https://leonaz.top:8765，转给本机 127.0.0.1:18765 上的 docker。
#
# 用法（服务器上）：
#   1. 部署目录的 .env 里加一行 PORT=127.0.0.1:18765，然后 ./deploy.sh up --cn
#      （docker 只监听本机，空出 8765 给 nginx）
#   2. cp apiloop.conf /etc/nginx/conf.d/apiloop.conf
#   3. nginx -t && nginx -s reload
#
# 为什么继续用 8765：客户端的本机数据按「云端主机名 + 端口」区分，端口不变，
# 换成 https 的新客户端装上后本机数据原样接着用。

# WebSocket 用：有 Upgrade 头就转成 upgrade，没有就正常关连接。
# 名字带 apiloop_ 前缀，免得和别的站点里同名的 map 冲突
map $http_upgrade $apiloop_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8765 ssl;
    # nginx 1.25 以下不认这一行：删掉它，把上面改成 listen 8765 ssl http2;
    http2 on;
    server_name leonaz.top;

    ssl_certificate     /etc/nginx/ssl/leonaz.top.crt;
    ssl_certificate_key /etc/nginx/ssl/leonaz.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:apiloop_ssl:10m;
    ssl_session_timeout 1d;

    # 用 http:// 打到这个端口时，跳到 https
    error_page 497 =301 https://$host:8765$request_uri;

    # 导入、备份恢复最大 50MB
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;

        # WebSocket（Mock 的 WebSocket 接口等）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $apiloop_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 同步、压测、下载安装包可能比较久
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 安装包几十 MB，直接边收边发，不先攒在 nginx 的临时文件里
        proxy_buffering off;
    }
}
